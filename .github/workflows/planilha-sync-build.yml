name: Build Planilha Sync — Windows .exe

# Dispara em:
#   1. push/PR em master que tocam arquivos da integração
#   2. tag do padrão  planilha-sync/v*.*.*  → também cria uma GitHub Release
#   3. botão manual (workflow_dispatch)
on:
  push:
    branches: [master, main]
    paths:
      - 'integrations/planilha-sync/**'
    tags:
      - 'planilha-sync/v*.*.*'
  pull_request:
    branches: [master, main]
    paths:
      - 'integrations/planilha-sync/**'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 — Build do executável no Windows
  # ─────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    defaults:
      run:
        working-directory: integrations/planilha-sync

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Extrair versão (tag ou SHA curto)
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/planilha-sync/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/planilha-sync/}"
          else
            VERSION="dev-$(echo ${GITHUB_SHA} | cut -c1-8)"
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Versão: ${VERSION}"

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: integrations/planilha-sync/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Injetar versão e commit no app/version.py
        shell: bash
        run: |
          python -c "
          import re
          p = 'app/version.py'
          with open(p, 'r', encoding='utf-8') as f:
              c = f.read()
          c = re.sub(r'VERSION\s*=\s*[\'\"][^\'\"]*[\'\"]', 'VERSION = \"${{ steps.version.outputs.value }}\"', c)
          c = re.sub(r'BUILD_COMMIT\s*=\s*[\'\"][^\'\"]*[\'\"]', 'BUILD_COMMIT = \"${{ github.sha }}\"', c)
          with open(p, 'w', encoding='utf-8') as f:
              f.write(c)
          "
          cat app/version.py

      - name: Build — One-File .exe + One-Dir portátil
        run: |
          python build.py --all

      - name: Comprimir distribuição portátil
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/planilha_sync `
            -DestinationPath dist/planilha_sync_windows_portable.zip `
            -Force

      # ── Artefatos de CI (sempre disponíveis no Actions) ─────────
      - name: Upload — Standalone .exe
        uses: actions/upload-artifact@v4
        with:
          name: planilha_sync_standalone_exe
          path: integrations/planilha-sync/dist/planilha_sync.exe
          retention-days: 30

      - name: Upload — Portátil .zip
        uses: actions/upload-artifact@v4
        with:
          name: planilha_sync_windows_portable
          path: integrations/planilha-sync/dist/planilha_sync_windows_portable.zip
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — Publicação Automática de Release (a cada commit / push)
  # ─────────────────────────────────────────────────────────────
  release:
    name: Publicar GitHub Release
    needs: build-windows
    if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/planilha-sync/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necessário para criar releases

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Baixar artefatos do build
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Listar artefatos
        working-directory: .
        run: ls -lR release-assets/

      - name: Criar ou Atualizar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Planilha Sync — ${{ needs.build-windows.outputs.version }}"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/planilha-sync/') && github.ref_name || 'latest' }}
          body: |
            ## Planilha Sync (${{ needs.build-windows.outputs.version }})

            - **Commit:** `${{ github.sha }}`
            - **Atualização:** Build automatizado via GitHub Actions

            ### Downloads
            | Arquivo | Descrição |
            |---|---|
            | `planilha_sync.exe` | Executável único — auto-atualizável |
            | `planilha_sync_windows_portable.zip` | Versão portátil com dependências |
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            release-assets/planilha_sync_standalone_exe/planilha_sync.exe
            release-assets/planilha_sync_windows_portable/planilha_sync_windows_portable.zip
